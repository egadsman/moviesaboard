name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo, fork PRs included.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then
            shellcheck $files
          else
            echo "no shell files yet"
          fi
